<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#7059ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="filterLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7059ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff3366" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#090a10"/>
  <circle cx="24" cy="32" r="16" fill="url(#starGlow)"/>
  <circle cx="24" cy="32" r="6" fill="#ffffff"/>
  <!-- The Filter Barrier Line -->
  <line x1="38" y1="8" x2="38" y2="56" stroke="url(#filterLine)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Dashed echoes beyond filter -->
  <line x1="46" y1="16" x2="46" y2="48" stroke="#7059ff" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="53" y1="24" x2="53" y2="40" stroke="#7059ff" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.3"/>
</svg>
